<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 480px;
    height: 272px;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    position: relative;
    user-select: none;
  }
  .bg {
    position: absolute;
    inset: 0;
    width: 480px;
    height: 272px;
    object-fit: cover;
    object-position: 70% center;
    filter: brightness(0.85) contrast(1.15) saturate(1.2);
  }
  /* Dark vignette on the entire left zone (x=0 to 205px) so the game card and XMB list never hide any artwork */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 82% 65%, rgba(255, 120, 0, 0.4) 0%, transparent 55%),
                linear-gradient(to right, rgba(2, 6, 18, 0.98) 0%, rgba(2, 6, 18, 0.92) 150px, rgba(2, 6, 18, 0.5) 205px, transparent 265px),
                linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 35%),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.6) 0%, transparent 25%);
    z-index: 1;
  }
  /* Jackie Chan reduced in size and anchored in lower-right */
  .jackie {
    position: absolute;
    right: 10px;
    bottom: 0px;
    height: 152px;
    object-fit: contain;
    filter: drop-shadow(0 0 14px rgba(255, 140, 0, 0.45)) drop-shadow(0 8px 18px rgba(0,0,0,0.95));
    z-index: 2;
  }
  /* Title pane moved further RIGHT: starts at x=235px, leaving entire left (0..230px) completely clear for XMB card */
  .right-pane {
    position: absolute;
    left: 236px;
    top: 14px;
    width: 180px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    z-index: 3;
  }
  .logo-img {
    width: 172px;
    filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 20px rgba(255, 215, 0, 0.35));
  }
  .badge-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .edition-badge {
    background: linear-gradient(135deg, rgba(20, 25, 45, 0.94), rgba(10, 15, 30, 0.98));
    border: 1px solid rgba(255, 215, 0, 0.75);
    border-radius: 3px;
    padding: 2.5px 7px;
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #FFE082;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    box-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }
  .version-tag {
    background: linear-gradient(135deg, #FF6F00, #FFA000);
    color: #FFF;
    font-size: 8px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .author-tag {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #64B5F6;
    text-shadow: 0 1px 3px rgba(0,0,0,0.95);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .features-strip {
    margin-top: 2px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    padding: 3.5px 8px;
    font-size: 7.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: #FFFFFF;
    text-shadow: 0 1px 2px rgba(0,0,0,0.95);
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .dragon-icon {
    width: 18px;
    height: 18px;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.9));
  }
</style>
</head>
<body>
  <img class="bg" src="../../res/pc/textures/frontend/background.png" alt="Background">
  <div class="vignette"></div>
  <img class="jackie" src="jackie_cutout.png" alt="Jackie Chan">
  
  <div class="right-pane">
    <img class="logo-img" src="jcslogo_cutout.png" alt="Jackie Chan Stuntmaster">
    <div class="badge-row">
      <span class="edition-badge">HD EDITION</span>
      <span class="version-tag">BETA 4.1</span>
    </div>
    <div class="author-tag">by luckvice</div>
    <div class="features-strip">
      <img class="dragon-icon" src="../../res/pc/textures/collectibles/gold_dragon.png" alt="Dragon">
      <span>60 FPS • MULTI LANGUAGE</span>
    </div>
  </div>
</body>
</html>
