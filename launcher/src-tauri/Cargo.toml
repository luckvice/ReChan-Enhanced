[package]
name = "rechan-launcher"
version = "0.1.0"
description = "RE:Chan desktop launcher"
authors = ["Lucas Soares"]
edition = "2021"

[lib]
name = "rechan_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Machine-friendly defaults: debuginfo for the app crates only; dependencies
# stay light so compiling Tauri does not exhaust memory on 8 GB machines.
[profile.dev]
debug = 0

[profile.dev.package.rechan-launcher]
debug = 2

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
